# Serves the console and proxies API calls, so the browser only ever talks to one origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://payrelay-api:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /sim/chaos/... → bank-simulator /chaos/...
    location /sim/ {
        proxy_pass http://bank-simulator:8081/;
    }

    # Client-side routing: unknown paths get the app shell.
    location / {
        try_files $uri /index.html;
    }
}
